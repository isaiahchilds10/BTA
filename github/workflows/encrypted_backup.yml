name: BTA encrypted daily snapshot (private repository only)
on:
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY_VISIBILITY: private
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BTA_BACKUP_KEY: ${{ secrets.BTA_BACKUP_KEY }}
      BTA_BACKUP_OUTPUT: /tmp/bta.enc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.secure_backup
      - uses: actions/upload-artifact@v4
        with:
          name: bta-encrypted-snapshot-${{ github.run_id }}
          path: /tmp/bta.enc
          if-no-files-found: error
          retention-days: 14
