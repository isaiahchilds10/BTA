
name: BTA research and live-status polling

on:
  schedule:
    - cron: '7,37 11-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bta-worker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      BTA_MODE: private
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.worker
